name: App bauen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testen und APK bauen
        run: ./gradlew --no-daemon test assembleRelease

      - name: APK benennen
        run: cp app/build/outputs/apk/release/app-release.apk sudoku.apk

      - name: APK zum Herunterladen ablegen
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-apk
          path: sudoku.apk

      # Auf main: als Release veröffentlichen. Der feste Link
      # https://github.com/JSusoH/sudoku/releases/latest/download/sudoku.apk
      # zeigt immer auf die neueste Version.
      - name: Neueste Version veröffentlichen
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sudoku 1.0.${{ github.run_number }}
          files: sudoku.apk
          make_latest: true
